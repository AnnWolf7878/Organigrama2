<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a2332; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg" style="width: 350px; background-color: #2c3e50; color: white;">
            <h3 class="text-center mb-4">Control de Acceso</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <input type="text" id="usuario" class="form-control" placeholder="Usuario" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">INGRESAR SISTEMA</button>
            </form>
            <div id="mensajeError" class="text-danger mt-3 text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuario, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard'; // Redirige al éxito
                } else {
                    document.getElementById('mensajeError').innerText = 'Usuario o contraseña incorrectos';
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
