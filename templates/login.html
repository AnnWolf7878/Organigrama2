<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Acceso</title>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Control de Acceso</h2>
        <input id="user" placeholder="Usuario" class="w-full p-3 mb-3 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-blue-500">
        <input id="pass" type="password" placeholder="Contraseña" class="w-full p-3 mb-6 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-blue-500">
        <button onclick="ingresar()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">INGRESAR SISTEMA</button>
    </div>

    <script>
        async function ingresar() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: user, password: pass })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = "/dashboard";
                } else {
                    alert('Error: ' + (data.error || 'Credenciales inválidas'));
                }
            } catch (err) {
                alert('Error de conexión con el servidor');
            }
        }
    </script>
</body>
</html>
