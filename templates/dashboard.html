<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2>Estructura Organizacional</h2>
            <div class="input-group mb-4">
                <input type="text" id="nombreEmpresa" class="form-control" placeholder="Escribe el nombre de la empresa...">
                <button class="btn btn-primary" onclick="cargarDatos()">Buscar Empresa</button>
            </div>
            <table class="table table-hover">
                <thead class="table-dark"><tr><th>Puesto</th><th>Nombre</th><th>Acción</th></tr></thead>
                <tbody id="tabla-organigrama">
                    <tr><td colspan="3" class="text-center">Ingresa una empresa para buscar</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function cargarDatos() {
            const tbody = document.getElementById('tabla-organigrama');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center">Buscando...</td></tr>';
            fetch('/api/organigrama')
                .then(r => r.json())
                .then(data => {
                    tbody.innerHTML = '';
                    data.estructura.forEach(item => {
                        tbody.innerHTML += `<tr><td>${item.puesto}</td><td>${item.nombre}</td><td><a href="${item.link}" class="btn btn-sm btn-info">Ver Perfil</a></td></tr>`;
                    });
                });
        }
    </script>
</body>
</html>
