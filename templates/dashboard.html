<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2>Estructura Organizacional</h2>
            <div class="input-group mb-4">
                <input type="text" id="nombreEmpresa" class="form-control" placeholder="Escribe el nombre...">
                <button class="btn btn-primary" onclick="ejecutarBusqueda()">Buscar Empresa</button>
            </div>
            <div id="status" class="text-muted">Esperando búsqueda...</div>
            <table class="table table-hover mt-3">
                <thead class="table-dark"><tr><th>Puesto</th><th>Nombre</th><th>Acción</th></tr></thead>
                <tbody id="tabla-organigrama"></tbody>
            </table>
        </div>
    </div>
    <script>
        function ejecutarBusqueda() {
            const status = document.getElementById('status');
            const tbody = document.getElementById('tabla-organigrama');
            status.innerText = "Buscando...";
            
            console.log("Iniciando fetch a /api/organigrama");
            
            fetch('/api/organigrama')
                .then(response => {
                    console.log("Respuesta recibida:", response.status);
                    return response.json();
                })
                .then(data => {
                    status.innerText = "Resultados obtenidos:";
                    tbody.innerHTML = '';
                    data.estructura.forEach(item => {
                        tbody.innerHTML += `<tr><td>${item.puesto}</td><td>${item.nombre}</td><td><button class="btn btn-sm btn-info">Ver</button></td></tr>`;
                    });
                })
                .catch(err => {
                    status.innerText = "Error: " + err;
                    console.error(err);
                });
        }
    </script>
</body>
</html>
