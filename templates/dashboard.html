<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-8">
    <div class="max-w-4xl mx-auto text-center">
        <input id="nombre" type="text" placeholder="Escribe la empresa aquí..." 
               class="w-full p-4 mb-4 bg-slate-900 border border-slate-700 rounded-xl text-white text-center">
        
        <button onclick="generar()" class="bg-blue-600 px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition">
            CARGAR DATOS
        </button>

        <div id="canvas" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <script>
        async function generar() {
            const emp = document.getElementById("nombre").value;
            const canvas = document.getElementById("canvas");
            canvas.innerHTML = "Cargando...";
            
            try {
                const res = await fetch('/api/organigrama?nombre=' + encodeURIComponent(emp));
                const d = await res.json();
                
                canvas.innerHTML = d.estructura.map(item => `
                    <a href="${item.link}" target="_blank" class="block bg-slate-900 border border-slate-700 p-4 rounded-lg hover:border-blue-500 transition">
                        <div class="text-[10px] text-blue-500 font-bold uppercase">${item.puesto}</div>
                        <div class="text-sm font-semibold text-white mt-1">${item.nombre}</div>
                    </a>
                `).join('');
            } catch (err) {
                canvas.innerHTML = "Error al cargar datos. Revisa la terminal.";
            }
        }
    </script>
</body>
</html>
