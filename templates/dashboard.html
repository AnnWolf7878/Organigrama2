<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Organigrama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">Panel de Control</a>
            <a href="/" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow p-4">
            <h2 class="mb-4">Estructura Organizacional</h2>
            
            <div class="input-group mb-4">
                <input type="text" id="nombreEmpresa" class="form-control" placeholder="Escribe el nombre de la empresa...">
                <button class="btn btn-primary" onclick="cargarDatos()">Buscar Empresa</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Puesto</th>
                            <th>Nombre</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-organigrama">
                        <tr>
                            <td colspan="3" class="text-center">Ingresa el nombre de una empresa para comenzar la búsqueda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function cargarDatos() {
            const empresa = document.getElementById('nombreEmpresa').value;
            const tbody = document.getElementById('tabla-organigrama');
            
            if (!empresa) {
                alert("Por favor, escribe el nombre de una empresa.");
                return;
            }

            tbody.innerHTML = '<tr><td colspan="3" class="text-center">Buscando información...</td></tr>';

            // Llamamos a tu API de Python pasando el nombre de la empresa
            fetch(`/api/organigrama?nombre=${encodeURIComponent(empresa)}`)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = ''; 

                    data.estructura.forEach(item => {
                        let row = `<tr>
                            <td><strong>${item.puesto}</strong></td>
                            <td>${item.nombre}</td>
                            <td>
                                <a href="${item.link}" target="_blank" class="btn btn-sm btn-info text-white">Ver Perfil</a>
                            </td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => {
                    console.error('Error al cargar datos:', error);
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Error al cargar datos. Inténtalo de nuevo.</td></tr>';
                });
        }
    </script>
</body>
</html>
